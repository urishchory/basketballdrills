  /* ---- grid ---- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1rem;
    padding-top: 1.4rem;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: .65rem;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 1rem 1.05rem 1.05rem;
    box-shadow: var(--shadow);
    transition: opacity .15s ease, border-color .15s ease;
  }
  .card:hover { border-color: color-mix(in srgb, var(--c) 50%, var(--line)); }
  .card[data-status="Not For Us"] { opacity: .5; }
  .card[data-status="Not For Us"]:hover { opacity: 1; }

  .card__head {
    display: flex;

    justify-content: space-between;
    gap: .6rem;
  }
  .tag-cat {

    font-weight: 600;
    line-height: 1;

    border-radius: 5px;

  .status {

    font-size: .73rem;
    color: var(--sc);
    white-space: nowrap;
  }
  .status::before {

    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--sc);
    flex: none;

  [data-status="To Try"]     { --sc: var(--s-try); }
  [data-status="Works Well"] { --sc: var(--s-good); }
  [data-status="Not For Us"] { --sc: var(--s-no); }

    line-height: 1.35;
    letter-spacing: -.005em;

-08-06", "notes": ""}, {"id": "C-F1NTHx-zi", "url": "https://www.instagram.com/reel/C-F1NTHx-zi/", "source": "coachjoshfan", "title": "1v1 From a Disadvantage — Finishing", "summary": "Offense starts behind, so every finish is contested from a trailing position. Sold as a defensive-effort drill as much as a finishing one.", "category": "Finishing", "type": "Small-Sided Game", "tags": ["disadvantage", "contested finish", "effort"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": ""}, {"id": "DAEflWkyiD0", "url": "https://www.instagram.com/reel/DAEflWkyiD0/", "source": "coachjoshfan", "title": "Nuisance Race 1v1 — Puzzle Per Rep", "summary": "Each rep is a small problem to solve, and the rules change to steer the focus: off hand only, must initiate contact before the finish, finish on the opposite side from where you started, or vary the starting position. Players can also be told to strip or block each other.", "category": "Warm-Up", "type": "Small-Sided Game", "tags": ["constraints", "off hand", "contact", "problem solving"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": "The source calls this his go-to offseason warm-up. The constraint list is the valuable part."}, {"id": "C_TbPJANual", "url": "https://www.instagram.com/reel/C_TbPJANual/", "source": "the.secret.trainer", "title": "Floater 1v1 — Defender Touches the Baseline", "summary": "Offense starts on either wing with the ball, defense starts on the smiley. Defense moves first and touches the baseline; offense responds and must attack middle toward the free-throw line, finishing with an open-hand floater off either foot or off two. Defense contests.", "category": "Finishing", "type": "Small-Sided Game", "tags": ["floater", "middle drive", "reaction"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": "You flagged this as good floater work — the source built the whole rule set around exactly that."}, {"id": "C_i8QwpNx8Q", "url": "https://www.instagram.com/reel/C_i8QwpNx8Q/", "source": "the.secret.trainer", "title": "Make It Take It 1v1", "summary": "Fast-paced finishing game — scorer keeps the ball, so runs of possession go to whoever is finishing.", "category": "Finishing", "type": "Small-Sided Game", "tags": ["make it take it", "pace", "competitive"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": ""}, {"id": "C_v2Rm-tb55", "url": "https://www.instagram.com/reel/C_v2Rm-tb55/", "source": "the.secret.trainer", "title": "Take the Ball — Finishing Warm-Up", "summary": "Both players stand close to the basket, one holding the ball. The other works to take it; whoever wins it finishes, the loser plays defense. Switch sides and holder every rep, one point per make, live offensive rebound, first to five.", "category": "Warm-Up", "type": "Small-Sided Game", "tags": ["physicality", "competitive", "first to 5"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": "You noted it also works from the dribble and with two players a side."}, {"id": "DAYrTSLN8XP", "url": "https://www.instagram.com/reel/DAYrTSLN8XP/", "source": "the.secret.trainer", "title": "Rock, Paper, Scissors Finishing", "summary": "Two players face each other side-on to the basket in the midrange, with a third holding a ball slightly behind. They play rock-paper-scissors; the winner takes the ball and attacks with a two-dribble maximum.", "category": "Warm-Up", "type": "Small-Sided Game", "tags": ["reaction", "midrange", "two dribble limit", "fun"], "players": "3", "status": "To Try", "added": "2026-08-06", "notes": ""}, {"id": "C-JkZkTNLxj", "url": "https://www.instagram.com/reel/C-JkZkTNLxj/", "source": "cramer_basketball", "title": "Transition 1v1 — Defender Picks the Angle", "summary": "The offensive player gets an advantage turning the corner while the defender chooses an angle that gives him a chance at a stop. Difficulty is tuned by adjusting the starting gap.", "category": "Team Play", "type": "Small-Sided Game", " gs dribble.", "category": "Ball Handling", "type": "Drill", "tags": ["between the legs", "teaching progression"], "players": "1", "status": "To Try", "added": "2026-08-06", "notes": "Caption blocked — described from your notes."}, {"id": "1801691207321719115", "url": "https://x.com/CourtsideVault/status/1801691207321719115", "source": "CourtsideVault", "title": "Krzyzewski — Defensive Slides Into Closeout", "summary": "Coach K drill chaining defensive slides straight into the closeout, so the recovery is trained as one continuous action.", "category": "Defense", "type": "Drill", "tags": ["slides", "closeout", "recovery", "Krzyzewski"], "players": "1+", "status": "To Try", "added": "2026-08-06", "notes": "You marked this one as excellent. X link — caption could not be pulled."}, {"id": "fb-265108109516663", "url": "https://www.facebook.com/reel/265108109516663", "source": "Facebook", "title": "Defensive Slides + Nail Dribble (Cross Step)", "summary": "Slides paired with a nail dribble, teaching the cross step as the recovery tool when the slide alone won't cover the ground.", "category": "Defense", "type": "Drill", "tags": ["slides", "cross step", "nail", "recovery"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": "Appeared twice in your doc (defense and teaching clips) — merged here. Facebook caption could not be pulled."}, {"id": "DAboQsoSdqm", "url": "https://www.instagram.com/reel/DAboQsoSdqm/", "source": "pat.haggerty4", "title": "Red Zone Defense — Wall-Ups and Verticals", "summary": "LSU practicing defense without fouling: wall-ups and verticality, drilled on day one of practice so the habit is set before the season.", "category": "Defense", "type": "Drill", "tags": ["verticality", "wall up", "no fouls", "1v1", "paint"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": "Good fit for your red-zone framing — contest hard without reaching."}, {"id": "C8eIK9UPtCh", "url": "https://www.instagram.com/reel/C8eIK9UPtCh/", "source": "goldenlights_takayuki.maejima", "title": "Aggressiveness Drills", "summary": "Contact-heavy sequence for raising the aggression level of a group that plays too passively.", "category": "Defense", "type": "Drill", "tags": ["aggression", "contact", "toughness"], "players": "2+", "status": "To Try", "added": "2026-08-06", "notes": "Source posted it without a real caption — described from your notes."}, {"id": "Cr8hEqAgxUt", "url": "https://www.instagram.com/reel/Cr8hEqAgxUt/", "source": null, "title": "Advantage or Clock — With the Nudge", "summary": "The core advantage-or-clock game with the nudge used to set the starting advantage. In 2v2 add the principle of filling one pass away from the ball, and advance if you didn't get the pass.", "category": "Team Play", "type": "Small-Sided Game", "tags": ["advantage or clock", "nudge", "spacing", "2v2"], "players": "2-4", "status": "To Try", "added": "2026-08-06", "notes": "Caption blocked — described from your notes. This is your base game; several others are variations of it."}, {"id": "fb-404400599021622", "url": "https://www.facebook.com/watch/?v=404400599021622", "source": "Facebook", "title": "Hot Potato", "summary": "In 2v2 add an attacker in a reaction position. Can start from a guard spot with a player ready weak-side — if he closes too far and doesn't space, he runs.", "category": "Team Play", "type": "Small-Sided Game", "tags": ["hot potato", "spacing", "2v2", "reaction"], "players": "4", "status": "To Try", "added": "2026-08-06", "notes": "Facebook caption could not be pulled — described from your notes."}, {"id": "1837501990500270457", "url": "https://x.com/transformbball/status/1837501990500270457", "source": "transformbball", "title": "1v1 With One in the Middle", "summary": "In 2v2 the extra player sits one position away from the ball, working advantage-or-clock plus the rule that if you didn't get the pass, you advance.", "category": "Team Play", "type": "Small-Sided Game", "tags": ["advantage or clock", "2v2", "spacing", "off ball"], "players": "3-4", "status": "To Try", "added": "2026-08-06", "notes": "X link — caption could not be pulled; described from your notes."}, {"id": "C7v4uCFMQlU", "url": "https://www.instagram.com/reel/C7v4uCFMQlU/", "source": "hoopslabglobal", "title": "Body Fakes 1v1 — Mastering the Hesi", "summary": "Two parts: hesitation without the dribble, then hesitation with a dribble progression. Built to keep defenders guessing rather than to drill a fixed move.", "category": "Footwork & Moves", "type": "Drill", "tags": ["hesitation", "body fake", "1v1", "progression"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": ""}, {"id": "fb-3668603846718866", "url": "https://www.facebook.com/reel/3668603846718866", "source": "Facebook", "title": "1v1 — Five Situations", "summary": "Five distinct 1v1 starting situations run as one block, so players face the whole range instead of one repeated look.", "category": "Team Play", "type": "Small-Sided Game", "tags": ["1v1", "variations", "situations"], "players": "2", "status": "To Try", "added": "2026-08-06", "notes": "Facebook caption could not be pulled — described from your notes."}, {"id": "1836395478050623607", "url": "https://x.com/transformbball/status/1836395478050623607", "source": "transformbball", "title": "High Five — Off-Ball Movement", "summary": "Off-ball movement game where help is only legal after the pass. In 2v2 add a help defender who is allowed to arrive.", "category": "Team Play", "type": "Small-Sided Game", "tags": ["off ball", "help timing", "special situations", "2v2"], "players": "4", "status": "To Try", "added": "2026-08-06", "notes": "Appeared twice in your doc (1v1 games and small-sided games) — merged here. X caption could not be pulled."}, {"id": "CtcpnUVNbqh", "url": "https://www.instagram.com/reel/CtcpnUVNbqh/", "source": "hoopin_mitch", "title": "2v1 From Varied Starts", "summary": "2v1 launched from several different starting positions so the read chan <script>
  (function () {
    var DB = JSON.parse(document.getElementById('data').textContent);
    var items = DB.items;
    var meta = DB.meta;

    var grid = document.getElementById('grid');
    var empty = document.getElementById('empty');
    var q = document.getElementById('q');
    var tally = document.getElementById('tally-num');

    var state = { text: '', category: null, type: null, status: null };

    function chip(value, group, cat) {
      var b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = value;
      b.setAttribute('aria-pressed', 'false');
      if (cat) b.setAttribute('data-cat', cat);
      b.dataset.group = group;
      b.dataset.value = value;
      b.addEventListener('click', function () {
        state[group] = state[group] === value ? null : value;
        syncChips();
        render();
      });
      return b;
    }

    // כותרות שורות הסינון מגיעות מ-meta.labels, עם ברירת מחדל לספריית התרגילים
    var labels = meta.labels || {};
    q.placeholder = labels.search || 'Search drills, tags, sources…';

    var catBox = document.getElementById('cats');
    catBox.firstElementChild.textContent = labels.category || 'Focus';
    meta.categories.forEach(function (c) { catBox.appendChild(chip(c, 'category', c)); });

    var typeBox = document.getElementById('types');
    typeBox.firstElementChild.textContent = labels.type || 'Format';
    meta.types.forEach(function (t) { typeBox.appendChild(chip(t, 'type', null)); });

    var statBox = document.getElementById('stats');
    statBox.firstElementChild.textContent = labels.status || 'Status';
    meta.statuses.forEach(function (s) { statBox.appendChild(chip(s, 'status', null)); });

    var reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'chip chip--reset';
    reset.textContent = 'Clear filters';
    reset.addEventListener('click', function () {
      state = { text: '', category: null, type: null, status: null };
      q.value = '';
      syncChips();
      render();
    });
    statBox.appendChild(reset);

    function syncChips() {
      document.querySelectorAll('.chip[data-group]').forEach(function (b) {
        b.setAttribute('aria-pressed', String(state[b.dataset.group] === b.dataset.value));
      });
    }

    function haystack(it) {
      return [it.title, it.summary, it.category, it.type, it.source, it.notes, (it.tags || []).join(' ')]
        .filter(Boolean).join(' ').toLowerCase();
    }

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function card(it) {
      var a = el('article', 'card');
      a.setAttribute('data-cat', it.category);
      a.setAttribute('data-status', it.status);

      var head = el('div', 'card__head');
      head.appendChild(el('span', 'tag-cat', it.category));
      head.appendChild(el('span', 'status', it.status));
      a.appendChild(head);

      a.appendChild(el('h2', 'card__title', it.title));
      if (it.summary) a.appendChild(el('p', 'card__summary', it.summary));

      if (it.tags && it.tags.length) {
        var ul = el('ul', 'tags');
        it.tags.forEach(function (t) { ul.appendChild(el('li', null, t)); });
        a.appendChild(ul);
      }

      if (it.notes) a.appendChild(el('p', 'card__notes', it.notes));

      var foot = el('div', 'card__foot');
      var m = el('div', 'meta');
      var kind = [it.type, it.players && it.players !== '—' ? it.players + ' players' : null]
        .filter(Boolean).join(' · ');
      m.appendChild(el('span', 'kind', kind));
      if (it.source) m.appendChild(el('span', 'src', '@' + it.source));
      foot.appendChild(m);

      if (it.url) {
        var link = el('a', 'open', 'Watch');
        link.href = it.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        foot.appendChild(link);
      } else {
        foot.appendChild(el('span', 'noclip', 'no clip'));
      }

      a.appendChild(foot);
      return a;
    }

    function render() {
      var t = state.text.trim().toLowerCase();
      var out = items.filter(function (it) {
        if (state.category && it.category !== state.category) return false;
        if (state.type && it.type !== state.type) return false;
        if (state.status && it.status !== state.status) return false;
        if (t && haystack(it).indexOf(t) === -1) return false;
        return true;
      });

      grid.textContent = '';
      out.forEach(function (it) { grid.appendChild(card(it)); });
      empty.hidden = out.length > 0;
      tally.textContent = out.length;
    }

    q.addEventListener('input', function () { state.text = q.value; render(); });
    render();
  })();
</script>
