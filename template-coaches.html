<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השראה למאמנים</title>
<meta name="description" content="__SUBTITLE__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f1; --surface:#ffffff; --ink:#1b1a19; --muted:#6b6763; --line:#e4e0db;
  --red:#c8102e; --red-ink:#a50d26; --red-soft:#fbe9ec; --chip:#efebe6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --surface:#1c1b1a; --ink:#f2efeb; --muted:#a29d97; --line:#2e2c2a;
    --red:#ff4d63; --red-ink:#ff7a8a; --red-soft:#3a1a20; --chip:#262422;
  }
}
:root[data-theme="dark"]{
  --bg:#121212; --surface:#1c1b1a; --ink:#f2efeb; --muted:#a29d97; --line:#2e2c2a;
  --red:#ff4d63; --red-ink:#ff7a8a; --red-soft:#3a1a20; --chip:#262422;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Rubik,system-ui,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{padding:28px 0 8px}
.eyebrow{color:var(--red);font-weight:700;font-size:14px;letter-spacing:.02em}
h1{font-size:clamp(28px,6vw,44px);line-height:1.1;margin:4px 0 8px;font-weight:800}
.sub{color:var(--muted);margin:0;max-width:60ch}
.how{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0;padding:0;list-style:none;font-size:14px}
.how li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.how b{color:var(--red)}

.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0 8px;border-bottom:1px solid var(--line)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink)}
.search input:focus,select:focus{outline:2px solid var(--red);outline-offset:1px}
select{font:inherit;font-size:15px;padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:42%}
.row{display:flex;align-items:center;gap:8px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.row::-webkit-scrollbar{display:none}
.row .lbl{flex:none;font-size:13px;color:var(--muted);font-weight:500;min-width:44px}
.chip{flex:none;font:inherit;font-size:14px;border:1px solid transparent;background:var(--chip);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--red);color:#fff}
.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.status{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted);margin:14px 0 10px}
.reset{font:inherit;font-size:14px;background:none;border:0;color:var(--red-ink);cursor:pointer;padding:4px;text-decoration:underline}

.grid{display:grid;grid-template-columns:1fr;gap:14px;padding-bottom:48px}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:1020px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.player{color:var(--red);font-weight:700;font-size:15px;background:none;border:0;padding:0;font:inherit;font-weight:700;cursor:pointer;text-align:right}
.meta{font-size:12px;color:var(--muted);white-space:nowrap}
.card h2{font-size:18px;line-height:1.3;margin:0;font-weight:700}
.hook{margin:0;color:var(--muted);font-size:15px}
.code{border-inline-start:4px solid var(--red);background:var(--red-soft);border-radius:8px;padding:10px 12px}
.code .k{font-size:12px;color:var(--red-ink);font-weight:700;display:block;margin-bottom:2px}
.code .t{font-weight:700;font-size:16px}
.court{font-size:14px;margin:0}
details{font-size:14px}
summary{cursor:pointer;color:var(--muted);font-weight:500}
details p{margin:6px 0 0}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;background:var(--chip);border-radius:999px;padding:3px 9px;color:var(--muted)}
.watch{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px;font-size:16px}
.watch:hover{filter:brightness(1.08)}
.watch:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0}
footer{color:var(--muted);font-size:13px;padding:0 0 32px}
footer a{color:var(--red-ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">קודים מנטליים · כדורסל</div>
    <h1>__TITLE__</h1>
    <p class="sub">__SUBTITLE__</p>
    <ul class="how">
      <li><b>1</b> בחרו קוד או שחקן</li>
      <li><b>2</b> הראו את הסרטון לקבוצה</li>
      <li><b>3</b> חזרו על הקוד באימון הבא</li>
    </ul>
  </header>

  <div class="controls" role="search">
    <div class="search">
      <input id="q" type="search" placeholder="חיפוש: שחקן, סיפור, מילה מהקוד…" aria-label="חיפוש" autocomplete="off">
      <select id="player" aria-label="שחקן"><option value="">כל השחקנים</option></select>
    </div>
    <div class="row" id="row-code"><span class="lbl">קוד</span></div>
    <div class="row" id="row-aud"><span class="lbl">למי</span></div>
    <div class="row" id="row-sport"><span class="lbl">ענף</span></div>
  </div>

  <div class="status"><span id="count" aria-live="polite"></span><button class="reset" id="reset" hidden>ניקוי סינון</button></div>
  <main class="grid" id="grid"></main>
  <footer>__COUNT__ סרטונים · כל סרטון נושא קוד אחד במילים המדויקות שהשחקנים שומעים באימון. <a href="./">לספריית התרגילים</a></footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(function(){
  var db = JSON.parse(document.getElementById('data').textContent);
  var items = db.items, meta = db.meta;
  var state = {q:'', player:'', code:'', aud:'', sport:''};

  // filters live in the URL so a coach can send a link to e.g. "?code=לקיחת אחריות"
  try {
    var sp = new URLSearchParams(location.search);
    for (var k in state) if (sp.get(k)) state[k] = sp.get(k);
  } catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  var norm = function(s){ return String(s||'').toLowerCase().replace(/[׳'"`״-]/g,''); };

  function chips(rowId, key, values){
    var row = $(rowId);
    var all = document.createElement('button');
    all.className='chip'; all.textContent='הכל'; all.dataset.v='';
    row.appendChild(all);
    values.forEach(function(v){
      var b = document.createElement('button');
      b.className='chip'; b.textContent=v; b.dataset.v=v; row.appendChild(b);
    });
    row.addEventListener('click', function(e){
      var b = e.target.closest('.chip'); if(!b) return;
      state[key] = (state[key]===b.dataset.v) ? '' : b.dataset.v;
      render();
    });
  }
  chips('row-code','code', meta.codes);
  chips('row-aud','aud', meta.audiences);
  if (meta.sports.length > 1) chips('row-sport','sport', meta.sports); else $('row-sport').hidden = true;

  var players = Array.from(new Set(items.map(function(i){ return i.player; }))).sort(function(a,b){ return a.localeCompare(b,'he'); });
  players.forEach(function(p){ var o=document.createElement('option'); o.value=p; o.textContent=p; $('player').appendChild(o); });

  items.forEach(function(it){
    it._s = norm([it.title,it.player,it.topic,it.story,it.hook,it.lesson,it.on_court,it.code&&it.code.text,it.code&&it.code.name,it.sport,(it.tags||[]).join(' '),(it.audience||[]).join(' ')].join(' '));
  });

  function card(it){
    var c = it.code || {};
    var codeLine = c.text || c.name || '';
    var court = it.on_court ? '<p class="court">'+esc(it.on_court)+'</p>' : '';
    var story = it.story ? '<details><summary>הסיפור</summary><p>'+esc(it.story)+'</p></details>' : '';
    var tags = (it.audience||[]).map(function(a){ return '<span class="tag">'+esc(a)+'</span>'; }).join('') +
               (it.sport && it.sport!=='כדורסל' ? '<span class="tag">'+esc(it.sport)+'</span>' : '') +
               (it.tags||[]).filter(function(t){ return t!=='מחוץ לכדורסל'; }).map(function(t){ return '<span class="tag">'+esc(t)+'</span>'; }).join('');
    return '<article class="card">'+
      '<div class="top"><button class="player" data-player="'+esc(it.player)+'">'+esc(it.player)+'</button><span class="meta">'+esc(it.topic||'')+'</span></div>'+
      '<h2>'+esc(it.title)+'</h2>'+
      (it.hook ? '<p class="hook">'+esc(it.hook)+'</p>' : '')+
      '<div class="code"><span class="k">'+(c.name && c.name!==codeLine.replace(/[.\s]+$/,'') && c.name!=='מסרים נוספים' ? 'הקוד · '+esc(c.name) : 'הקוד')+'</span><span class="t">'+esc(codeLine)+'</span></div>'+
      court + story +
      '<div class="tags">'+tags+'</div>'+
      '<a class="watch" href="'+esc(it.url)+'" target="_blank" rel="noopener">▶ לצפייה בסרטון</a>'+
    '</article>';
  }

  function render(){
    var q = norm(state.q).trim().split(/\s+/).filter(Boolean);
    var list = items.filter(function(it){
      if (state.player && it.player!==state.player) return false;
      if (state.code && (!it.code || it.code.name!==state.code)) return false;
      if (state.aud && (it.audience||[]).indexOf(state.aud)<0) return false;
      if (state.sport && it.sport!==state.sport) return false;
      return q.every(function(w){ return it._s.indexOf(w)>=0; });
    });
    $('grid').innerHTML = list.length ? list.map(card).join('') :
      '<p class="empty">לא נמצא סרטון. נסו מילה אחרת או נקו את הסינון.</p>';
    $('count').textContent = list.length===items.length ? items.length+' סרטונים' : list.length+' מתוך '+items.length+' סרטונים';
    [['row-code','code'],['row-aud','aud'],['row-sport','sport']].forEach(function(r){
      $(r[0]).querySelectorAll('.chip').forEach(function(b){ b.setAttribute('aria-pressed', String(b.dataset.v===state[r[1]])); });
    });
    $('player').value = state.player;
    if ($('q').value!==state.q) $('q').value = state.q;
    var active = state.q||state.player||state.code||state.aud||state.sport;
    $('reset').hidden = !active;
    try {
      var sp = new URLSearchParams();
      for (var k in state) if (state[k]) sp.set(k, state[k]);
      var qs = sp.toString();
      history.replaceState(null,'', qs ? '?'+qs : location.pathname);
    } catch(e){}
  }

  $('q').addEventListener('input', function(e){ state.q = e.target.value; render(); });
  $('player').addEventListener('change', function(e){ state.player = e.target.value; render(); });
  $('grid').addEventListener('click', function(e){
    var b = e.target.closest('.player'); if(!b) return;
    state.player = b.dataset.player; render(); window.scrollTo({top:0,behavior:'smooth'});
  });
  $('reset').addEventListener('click', function(){ state={q:'',player:'',code:'',aud:'',sport:''}; render(); });
  render();
})();
</script>
</body>
</html>
